name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and release audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate agent skill metadata
        run: python tools/validate_skill.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile Python modules
        run: python tools/compile_check.py

      - name: Audit release files
        run: python tools/release_audit.py
